[build-system]
requires = [
    # Same as dependency-groups.build, last refreshed July 2026
    "cython~=3.2.0",
    "meson~=1.11.0",
    "meson-python~=0.19.0",
    "ninja~=1.13.0",
]
build-backend = 'mesonpy'

[dependency-groups]
build = [
    # Same as build-system.requires
    "cython~=3.2.0",
    "meson~=1.11.0",
    "meson-python~=0.19.0",
    "ninja~=1.13.0",
]
changelog = [
    "reno==4.1.0",  # latest as of July 2026
]
dev = [
    "oldest-supported-numpy; python_version < '3.13'",
    "numpy~=2.3.0; python_version >= '3.13'",  # first that supports Python 3.14
    {include-group = "build"},
    {include-group = "changelog"},
]
docs = [
    "pydata-sphinx-theme==0.14.3",
    "sphinx==7.3.7",
    "breathe==4.36.0",
    "notebook==6.4.11",
    "networkx==3.2.0",
]
test = [
    "parameterized==0.9.0",
    "pandas~=2.3.0; python_version < '3.14'",
    "pandas~=3.0.0; python_version >= '3.14'",
    "networkx==3.2.0",
    "pymongo~=4.17.0",
]

[project]
name = "dimod"
dynamic = ["version"]
authors = [
    {name = "D-Wave", email = "tools@dwavesys.com"},
]
description = "A shared API for binary quadratic model samplers."
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    'Programming Language :: Python :: Implementation :: CPython',
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.17.3",  # oldest supported NumPy on Python 3.8
]

[project.optional-dependencies]
all = []  # left in for backward- and forward-compatibility

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Changelog = "https://github.com/dwavesystems/dimod/releases"
Documentation = "https://docs.dwavequantum.com"
"Source Code" = "https://github.com/dwavesystems/dimod"

[tool.cibuildwheel]
build-verbosity = "1"
skip = "*musllinux*"

test-command = ["python -m unittest"]
test-groups = ["test"]
test-sources = ["tests"]

[tool.cibuildwheel.linux]
archs = "x86_64 aarch64"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# We follow NumPy and don't build universal wheels, see https://github.com/numpy/numpy/pull/20787
archs = "x86_64 arm64"

[tool.cibuildwheel.windows]
archs = "AMD64"
