---
fixes:
  - |
    Fix the order in which the ``Expression`` methods ``add_quadratic()``,
    ``add_quadratic_back()`` and ``set_quadratic()`` add new variables to a
    constrained quadratic model's objective or constraint. The order depended
    on the compiler, so it differed between platforms; all platforms now use
    the order of the Linux and Windows builds. On macOS, the order of the new
    variables in a quadratic term is reversed compared to previous versions.
    See `#1440 <https://github.com/dwavesystems/dimod/issues/1440>`_.
